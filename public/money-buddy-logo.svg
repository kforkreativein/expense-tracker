<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Money Buddy app icon</title>
  <desc id="desc">A simple charcoal wallet with ivory cash and an emerald growth arrow.</desc>
  <defs>
    <linearGradient id="tile" x1="76" y1="58" x2="440" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#303030"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="wallet" x1="108" y1="206" x2="404" y2="406" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D3D3D"/>
      <stop offset="1" stop-color="#242424"/>
    </linearGradient>
    <linearGradient id="cash" x1="170" y1="122" x2="298" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#E9E3D6"/>
    </linearGradient>
    <filter id="depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity=".46"/>
      <feDropShadow dx="-3" dy="-3" stdDeviation="6" flood-color="#FFFFFF" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#tile)"/>
