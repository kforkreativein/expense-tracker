    <rect x="156" y="128" width="86" height="132" rx="18" fill="url(#cash)" transform="rotate(9 156 128)"/>
    <rect x="202" y="114" width="86" height="146" rx="18" fill="url(#cash)" transform="rotate(3 202 114)"/>
    <rect x="248" y="130" width="86" height="130" rx="18" fill="url(#cash)" transform="rotate(-7 248 130)"/>
    <rect x="90" y="210" width="332" height="192" rx="52" fill="url(#wallet)" stroke="#5A5A5A" stroke-width="9"/>
    <path d="M90 276h250c39 0 70 31 70 70v6c0 28-23 50-50 50H90" fill="#343434" stroke="#646464" stroke-width="9"/>
    <path d="M187 338l51-47 31 28 62-65" fill="none" stroke="#4ED182" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M303 254h28v28" fill="none" stroke="#4ED182" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="356" cy="346" r="12" fill="#4ED182"/>
